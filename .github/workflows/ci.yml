# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Every JSON file parses
        run: for f in $(git ls-files '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Lint the spec (structural rules)
        run: |
          set -e
          for f in openapi.json openapi.yaml; do
            [ -f "$f" ] && npx --yes @redocly/cli@1 lint "$f" --extends=minimal --format=github-actions
          done
