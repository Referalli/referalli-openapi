# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Attaches the spec and the Postman collection to a GitHub release for each vX.Y.Z tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $(git ls-files 'openapi.*' '*postman_collection.json')
        env:
          GH_TOKEN: ${{ github.token }}
